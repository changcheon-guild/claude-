<style>
/* Layout: an edit-bay monitor. 16:9 viewer with burned-in HUD, transport + shot timeline below, shot cards under that. */
:root {
  --bg: #141215;
  --panel: #1d1a1e;
  --line: #322d33;
  --fg: #eee8eb;
  --muted: #9d939a;
  --sakura: #f2a9bf;
  --sakura-dim: #6b4452;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.meta { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }

.monitor { display: grid; gap: 10px; }
.viewport { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); overflow: hidden; }
.viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-mono); font-size: clamp(10px, 1.4vw, 13px); letter-spacing: 0.06em; color: #fff; }
.hud > div { position: absolute; display: flex; gap: 10px; align-items: center; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.hud-tl { top: 3%; left: 2.5%; }
.hud-tr { top: 3%; right: 2.5%; }
.hud-bl { bottom: 3.5%; left: 2.5%; right: 2.5%; justify-content: center; }
.badge { background: #fff; color: #111; font-weight: 500; padding: 1px 7px; text-shadow: none; }
.spec { background: rgba(10,8,10,.55); padding: 3px 10px; text-transform: uppercase; }
.state { color: var(--sakura); }
.guides { position: absolute; inset: 0; opacity: 0; transition: opacity .2s; }
.guides.on { opacity: 1; }
.guides i { position: absolute; background: rgba(255,255,255,.35); }
.guides .safe { position: absolute; inset: 5% 5%; border: 1px dashed rgba(255,255,255,.35); }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.controls .spacer { flex: 1; }
button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); height: 34px; min-width: 34px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; border-radius: 2px; }
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--sakura); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--sakura); color: var(--sakura); }
button svg { width: 14px; height: 14px; fill: currentColor; }
.btn-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; }
.tc { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.timeline { position: relative; display: flex; height: 40px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; touch-action: none; user-select: none; }
.seg { position: relative; display: flex; align-items: center; padding-left: 8px; border-right: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; overflow: hidden; white-space: nowrap; min-width: 0; }
.seg:last-child { border-right: 0; }
.seg.active { color: var(--fg); background: color-mix(in srgb, var(--sakura) 12%, transparent); }
.seg b { font-weight: 500; color: inherit; margin-right: 6px; }
.playhead { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--sakura); pointer-events: none; }
.playhead::before { content: ""; position: absolute; top: 0; left: -4px; border: 5px solid transparent; border-top-color: var(--sakura); }

.shots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .shots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .shots { grid-template-columns: minmax(0, 1fr); } }
.card { text-align: left; display: grid; gap: 8px; align-content: start; height: auto; padding: 14px; background: transparent; border: 1px solid var(--line); }
.card.active { border-color: var(--sakura); background: color-mix(in srgb, var(--sakura) 6%, transparent); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-id { font-family: var(--font-mono); font-weight: 500; font-size: 15px; }
.card.active .card-id { color: var(--sakura); }
.card-dur { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.card-spec { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.04em; color: var(--muted); text-transform: uppercase; }
.card-desc { font-size: 14px; line-height: 1.6; }
.note { font-size: 13px; color: var(--muted); max-width: 70ch; }
kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); padding: 0 4px; border-radius: 2px; }
</style>

<div class="wrap">
  <header>
    <h1>벚꽃길 나들이 · 프리비즈</h1>
    <div class="meta">Shots S1–S4 · 14 sec · 24 fps · 2.39 safe off / 16:9</div>
  </header>

  <section class="monitor" aria-label="프리비즈 뷰어">
    <div class="viewport" id="vp">

      <button id="bPlay" aria-label="재생/일시정지"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2l10 6-10 6z"/></svg></button>
      <button id="bNext" aria-label="다음 샷"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>

    </div>
  </section>

  <section class="shots" id="shots" aria-label="샷 리스트"></section>

  <p class="note">블록아웃 수준의 프리비즈입니다. 렌즈는 Super 35 기준 초점거리, 샷 길이와 카메라 무브는 콘티 표기를 그대로 따랐습니다. 샷 카드를 누르면 해당 샷으로 이동합니다. <kbd>Space</kbd> 재생, <kbd>←</kbd><kbd>→</kbd> 샷 이동, <kbd>G</kbd> 가이드.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(() => {
'use strict';

// ---------- helpers ----------
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t * t * (3 - 2 * t);
const easeSoft = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const matCache = {};
const M = (c, o = {}) => { const k = c + JSON.stringify(o); return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial(Object.assign({ color: c }, o))); };
function mesh(geo, mat, cast = true, recv = true) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = recv; return m; }
function box(p, w, h, d, c, x, y, z) { const m = mesh(new THREE.BoxGeometry(w, h, d), typeof c === 'string' ? M(c) : c); m.position.set(x, y, z); p.add(m); return m; }
function rod(p, a, b, r1, r2, mat, seg = 6) {
  const dir = V(0, 0, 0).subVectors(b, a); const len = dir.length();
  const m = mesh(new THREE.CylinderGeometry(r2, r1, len, seg), mat);
  m.position.copy(a).addScaledVector(dir, .5); m.quaternion.setFromUnitVectors(UP, dir.normalize()); p.add(m); return m;
}
function instBoxes(p, list, w, h, d, mat) {
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(w, h, d), mat, list.length); const o = new THREE.Object3D();
  list.forEach((q, i) => { o.position.set(q[0], q[1], q[2]); o.rotation.set(0, q[3] || 0, 0); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
  im.castShadow = im.receiveShadow = true; p.add(im); return im;
}

const BLOSSOM = ['#f9d4de', '#f4bfce', '#fde9ef', '#ffffff', '#f7c9d6', '#fbdde6'];
const BARK = M('#6d5f5a');
class Blossoms {
  constructor() { this.items = []; }
  add(x, y, z, r, c) { this.items.push([x, y, z, r, c]); }
  build(p) {
    const im = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true }), this.items.length);
    const o = new THREE.Object3D(), col = new THREE.Color();
    this.items.forEach((it, i) => { o.position.set(it[0], it[1], it[2]); o.scale.set(it[3], it[3] * .82, it[3]); o.rotation.set(i * 1.3, i * .7, 0); o.updateMatrix(); im.setMatrixAt(i, o.matrix); im.setColorAt(i, col.set(it[4])); });
    im.castShadow = im.receiveShadow = true; p.add(im); return im;
  }
}
function tree(p, bl, r, x, z, s = 1, lean = 0, y0 = 0, leanZ = 0, minY = -Infinity) {
  const top = V(x + lean * .7 * s, y0 + 2.4 * s, z + leanZ * .7 * s);
  rod(p, V(x, y0, z), top, .2 * s, .13 * s, BARK, 7);
  const cx = x + lean * 1.8 * s, cy = y0 + 3.4 * s, cz = z + leanZ * 1.8 * s;
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * Math.PI * 2 + r() * .8;
    rod(p, top, V(cx + Math.cos(a) * 1.6 * s, cy + r() * .6 * s, cz + Math.sin(a) * 1.6 * s), .09 * s, .04 * s, BARK, 5);
  }
  for (let i = 0; i < 24; i++) {
    const a = r() * Math.PI * 2, rr = Math.sqrt(r());
    const rad = (.5 + r() * .5) * s; bl.add(cx + Math.cos(a) * rr * 2.6 * s, Math.max(minY + rad * .7, cy + (r() - .35) * 1.5 * s), cz + Math.sin(a) * rr * 2.6 * s, rad, BLOSSOM[(r() * BLOSSOM.length) | 0]);
  }
}

// ---------- people (mannequins, like the boards) ----------
const SHIRTS = ['#dcd8d4', '#bfc4c9', '#a8aeb5', '#e6dfd8', '#8f969e', '#cbc1b8', '#b7b0b8'];
const PANTS = ['#5c6168', '#7a8087', '#4a4e55', '#8a8179', '#6b6570'];
const HAIR = ['#3a3332', '#4a3f3a', '#2b292a', '#5a4a40'];
function person(o) {
  const s = o.h / 1.7, g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const skin = M('#eadcd2'), shirt = M(o.shirt), pants = M(o.pants || '#5c6168');
  const cap = (r, l, m) => mesh(new THREE.CapsuleGeometry(r, l, 3, 8), m);
  const legs = [], arms = [];
  for (const side of [-1, 1]) {
    const lp = new THREE.Group(); lp.position.set(side * .1 * s, .88 * s, 0);
    const leg = cap(.068 * s, .68 * s, o.dress ? skin : pants); leg.position.y = -.42 * s; lp.add(leg);
    const shoe = mesh(new THREE.BoxGeometry(.11 * s, .07 * s, .22 * s), M(o.shoe || '#f1efec')); shoe.position.set(0, -.84 * s, .04 * s); lp.add(shoe);
    body.add(lp); legs.push(lp);
    const ap = new THREE.Group(); ap.position.set(side * .235 * s, 1.42 * s, 0);
    const arm = cap(.048 * s, .48 * s, o.sleeve ? shirt : skin); arm.position.y = -.28 * s; ap.add(arm);
    if (!o.sleeve) { const sl = cap(.058 * s, .1 * s, shirt); sl.position.y = -.08 * s; ap.add(sl); }
    body.add(ap); arms.push(ap);
  }
  const torso = cap(.17 * s, .3 * s, shirt); torso.position.y = 1.2 * s; torso.scale.z = .72; body.add(torso);
  if (o.dress) { const d = mesh(new THREE.ConeGeometry(.33 * s, .52 * s, 14, 1, true), M(o.dress, { side: THREE.DoubleSide })); d.position.y = .98 * s; body.add(d); }
  const hr = .115 * s * (o.head || 1), hy = 1.44 * s + hr;
  const head = mesh(new THREE.SphereGeometry(hr, 16, 12), skin); head.position.y = hy; body.add(head);
  const hair = mesh(new THREE.SphereGeometry(hr * 1.08, 16, 12, 0, Math.PI * 2, 0, Math.PI * (o.long ? .62 : .5)), M(o.hair || HAIR[0])); hair.position.set(0, hy + hr * .05, -hr * .12); body.add(hair);
  if (o.long) { const b = mesh(new THREE.CylinderGeometry(hr * 1.02, hr * 1.1, hr * 1.3, 14, 1, true, Math.PI * .5, Math.PI), M(o.hair || HAIR[0], { side: THREE.DoubleSide })); b.position.set(0, hy - hr * .5, -hr * .05); body.add(b); }
  if (o.cap) { const c = mesh(new THREE.SphereGeometry(hr * 1.1, 14, 8, 0, Math.PI * 2, 0, Math.PI * .5), M(o.cap)); c.position.y = hy + hr * .1; body.add(c); }
  if (o.backpack) box(body, .32 * s, .42 * s, .16 * s, o.backpack, 0, 1.22 * s, -.2 * s);
  if (o.bag) { const b = box(body, .2 * s, .22 * s, .08 * s, o.bag, .26 * s, .98 * s, 0); b.rotation.z = .1; rod(body, V(.26 * s, 1.08 * s, 0), V(-.12 * s, 1.45 * s, 0), .01 * s, .01 * s, M(o.bag), 4); }
  return { g, body, legs, arms, s };
}
function pose(p, ph, o) {
  const sw = Math.sin(ph);
  p.legs[0].rotation.x = sw * o.stride; p.legs[1].rotation.x = -sw * o.stride;
  p.arms.forEach((a, i) => {
    const side = i ? 1 : -1;
    if (o.armsOut) a.rotation.set(-.25 + (i ? sw : -sw) * .15, 0, side * (1.25 + Math.sin(ph * .5 + i) * .08));
    else if (o.armUp && i === 1) a.rotation.set(-2.9, 0, .15);
    else a.rotation.set((i ? sw : -sw) * o.arm, 0, side * .07);
  });
  p.body.position.y = Math.abs(Math.cos(ph)) * (o.bounce || 0);
  p.body.rotation.x = o.lean || 0;
}
function crowd(p, r, n, area, walkMin = .9, walkMax = 1.4) {
  const list = [];
  for (let i = 0; i < n; i++) {
    const w = { p: person({ h: 1.55 + r() * .3, shirt: SHIRTS[(r() * SHIRTS.length) | 0], pants: PANTS[(r() * PANTS.length) | 0], hair: HAIR[(r() * HAIR.length) | 0], long: r() < .4, backpack: r() < .25 ? '#6f757c' : null, sleeve: r() < .5 }),
      x: lerp(area.x0, area.x1, r()), z: lerp(area.z0, area.z1, r()), dir: r() < (area.toward ?? .5) ? 1 : -1, v: lerp(walkMin, walkMax, r()), ph: r() * 6 };
    p.add(w.p.g); list.push(w);
  }
  return t => list.forEach(w => {
    w.p.g.position.set(w.x, area.y || 0, w.z + w.dir * w.v * t);
    w.p.g.rotation.y = w.dir > 0 ? 0 : Math.PI;
    pose(w.p, w.ph + t * w.v * 5.2, { stride: .35, arm: .3 });
  });
}

// ---------- petals ----------
const PETAL_MAT = new THREE.MeshLambertMaterial({ color: 0xf8cdd9, emissive: 0x7a5560, side: THREE.DoubleSide });
function petalGeo(size) { const g = new THREE.CircleGeometry(size, 7); g.scale(1, .68, 1); return g; }
function fallingPetals(p, n, b, size, seed, o = {}) {
  const r = rng(seed), im = new THREE.InstancedMesh(petalGeo(size), PETAL_MAT, n), obj = new THREE.Object3D();
  const d = Array.from({ length: n }, () => ({ x: lerp(b[0], b[1], r()), y: r(), z: lerp(b[4], b[5], r()), v: (o.v || 1) * (.5 + r() * .6), w: .8 + r() * 1.6, ph: r() * 6.3, rs: 1 + r() * 3 }));
  p.add(im);
  const H = b[3] - b[2], sway = o.sway ?? size * 20, wind = o.wind ?? 0;
  return t => { d.forEach((q, i) => {
    obj.position.set(q.x + Math.sin(t * q.w + q.ph) * sway + wind * t, b[3] - ((q.y * H + q.v * t) % H), q.z + Math.cos(t * q.w * .7 + q.ph) * sway);
    obj.rotation.set(t * q.rs + q.ph, t * q.rs * .6, q.ph); obj.updateMatrix(); im.setMatrixAt(i, obj.matrix);
  }); im.instanceMatrix.needsUpdate = true; };
}
function groundPetals(p, n, b, y, size, seed) {
  const r = rng(seed), im = new THREE.InstancedMesh(petalGeo(size), PETAL_MAT, n), o = new THREE.Object3D();
  for (let i = 0; i < n; i++) { o.position.set(lerp(b[0], b[1], r()), y, lerp(b[2], b[3], r())); o.rotation.set(-Math.PI / 2 + (r() - .5) * .3, 0, r() * 6.3); o.updateMatrix(); im.setMatrixAt(i, o.matrix); }
  im.receiveShadow = true; p.add(im); return im;
}
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,250,1)'); g.addColorStop(.18, 'rgba(255,252,240,.95)'); g.addColorStop(.45, 'rgba(255,245,235,.35)'); g.addColorStop(1, 'rgba(255,245,235,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
}

// ---------- renderer ----------
const canvas = document.getElementById('c'), vp = document.getElementById('vp');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 16 / 9, .005, 1200); camera.filmGauge = 24.89; // Super 35 width
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9adb1, .72));
const sun = new THREE.DirectionalLight(0xfffaf2, .85); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0005;
scene.add(sun, sun.target);
function setSun(pos, target, half, far) {
  sun.position.copy(pos); sun.target.position.copy(target);
  const c = sun.shadow.camera; c.left = c.bottom = -half; c.right = c.top = half; c.near = .001 * far; c.far = far; c.updateProjectionMatrix();
}

// ===================== S1 : ECU blossom, petal falls =====================
function buildS1() {
  const g = new THREE.Group(), r = rng(11), bl = new Blossoms();
  // out-of-focus blossom bokeh behind the branch
  const glow = glowTexture();
  for (let i = 0; i < 46; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, fog: false, depthWrite: false, transparent: true, opacity: .35 + r() * .4, color: new THREE.Color(BLOSSOM[(r() * 6) | 0]).lerp(new THREE.Color('#e7a3b8'), r() * .6) }));
    sp.position.set(lerp(-1.1, 1.3, r()), lerp(-.9, .9, r()), -3 - r() * 3); sp.scale.setScalar(.25 + r() * .6); g.add(sp);
  }
  // branch
  const barkS1 = M('#5e514d');
  const curve = new THREE.CatmullRomCurve3([V(-.2, .16, -.03), V(-.11, .118, 0), V(-.04, .095, .005), V(.03, .086, 0), V(.075, .09, -.01)]);
  g.add(mesh(new THREE.TubeGeometry(curve, 48, .0045, 8), barkS1));
  // flowers
  const petalG = new THREE.SphereGeometry(1, 14, 10), petalM = M('#fcecf1'), petalM2 = M('#f7d3de');
  const stamenM = M('#d9a650'), centerM = M('#d88aa0');
  const cam0 = V(0, .07, .55);
  function flower(pos, tilt, seed) {

addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea') || e.target === tl) return;
  if (e.code === 'Space') { e.preventDefault(); $('bPlay').click(); }
  else if (e.key === 'ArrowRight') $('bNext').click();
  else if (e.key === 'ArrowLeft') $('bPrev').click();
  else if (e.key === 'g' || e.key === 'G') $('bGuides').click();
});
syncButtons();

function resize() { const w = vp.clientWidth, h = vp.clientHeight; if (w && h) renderer.setSize(w, h, false); }
new ResizeObserver(resize).observe(vp); resize();

const tc = t => { const f = Math.floor(t * FPS); const ss = Math.floor(f / FPS), ff = f % FPS; return `00:00:${String(ss).padStart(2, '0')}:${String(ff).padStart(2, '0')}`; };
function render() {
  const i = shotAt(T), s = SHOTS[i], lt = clamp(T - s.start, 0, s.dur);
  if (i !== cur) {
    SHOTS.forEach((x, k) => { x.group.visible = k === i; x.seg.classList.toggle('active', k === i); x.card.classList.toggle('active', k === i); });
    scene.background = new THREE.Color(s.bg); scene.fog = s.fog; s.sun();
    $('hudShot').textContent = s.id; $('hudLens').textContent = s.lens; $('hudSpec').textContent = s.spec; cur = i;
  }
  s.update(lt);
  const c = s.cam(lt / s.dur);
  camera.setFocalLength(c.focal); camera.near = c.focal > 60 ? .005 : .05; camera.updateProjectionMatrix();
  camera.position.copy(c.pos); camera.lookAt(c.look);
  renderer.render(scene, camera);
  $('hudTc').textContent = tc(T);
  $('tc').textContent = `${String(Math.floor(T)).padStart(2, '0')}:${String(Math.floor(T % 1 * FPS)).padStart(2, '0')} / ${TOTAL}s`;
  ph.style.left = (T / TOTAL * 100) + '%'; tl.setAttribute('aria-valuenow', T.toFixed(2));
}
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing && !scrub) { T += dt; if (T >= TOTAL) { if (loop) T %= TOTAL; else { T = TOTAL - 1e-4; playing = false; syncButtons(); } } }
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
